<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}CEO — Grupo DSC{% endblock %}</title>
  <link rel="stylesheet" href="/static/estilo.css">
</head>
<body>
  {% if pessoa %}
  <header class="topo">
    <span class="marca">CEO — Grupo DSC</span>
    <nav>
      <a href="/board">Meu quadro</a>
      {% if pessoa.eh_chefe %}
      <a href="/chefe">Visão geral</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/admin">Admin</a>
      {% endif %}
      <a href="/logout">Sair ({{ pessoa.nome }})</a>
    </nav>
  </header>
  {% endif %}
  <main class="conteudo">
    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
