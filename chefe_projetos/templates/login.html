{% extends "base.html" %}
{% block titulo %}Entrar — Chefe de Projetos{% endblock %}
{% block conteudo %}
<div class="cartao-login">
  <h1>Chefe de Projetos</h1>
  <p class="ajuda">Escolha seu nome e digite seu PIN. No primeiro acesso, o PIN que você digitar vira o seu.</p>
  {% if erro %}<p class="erro">{{ erro }}</p>{% endif %}
  <form method="post" action="/login">
    <label for="pessoa_id">Quem é você?</label>
    <select name="pessoa_id" id="pessoa_id" required>
      {% for p in pessoas %}
      <option value="{{ p.id }}">{{ p.nome }} — {{ p.cargo }}{% if not p.tem_pin %} (definir PIN){% endif %}</option>
      {% endfor %}
    </select>
    <label for="pin">PIN (4+ dígitos)</label>
    <input type="password" inputmode="numeric" name="pin" id="pin" minlength="4" required>
    <button type="submit">Entrar</button>
  </form>
</div>
{% endblock %}
